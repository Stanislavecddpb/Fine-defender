# Бизнес-конфиг MVP. Всё, что меняется без правки кода: пороги, паттерны причин,
# расписание выгрузки, формула дедлайна оспаривания.
# ВНИМАНИЕ: значения, помеченные [СВЕРИТЬ], нужно подтвердить по dev.wildberries.ru
# и актуальной оферте WB до боевого использования (см. раздел 13 ТЗ).

wb:
  base_url: "https://statistics-api.wildberries.ru"
  # [СВЕРИТЬ] метод мигрирует; v5 объявлен к отключению
  report_endpoint: "/api/v5/supplier/reportDetailByPeriod"
  page_limit: 100000          # [СВЕРИТЬ] лимит строк за запрос
  request_timeout_seconds: 60

ingestion:
  # Базовый отчёт WB — недельный. Cron: понедельник 06:00.
  schedule_cron: "0 6 * * 1"
  default_period_days: 7
  retry:
    max_attempts: 5
    base_delay_seconds: 2
    max_delay_seconds: 60
  # Сколько подряд упавших прогонов на селлера => алерт (наблюдаемость)
  consecutive_failure_alert_threshold: 3

classifier:
  # Типы операций (колонка «Виды логистики, штрафов и корректировок ВВ»),
  # которые считаем штрафами. [СВЕРИТЬ] точные значения по реальному отчёту.
  fine_operation_types:
    - "ШТРАФ"
    - "УДЕРЖАНИЕ"
  # Маппинг причина -> категория. На MVP интересует только oversize_logistics.
  # Срабатывает, если строка-расшифровка причины содержит любой из паттернов.
  reason_patterns:
    oversize_logistics:
      - "габарит"
      - "обмер"
      - "превышен"
      - "несоответствие размеров"

dispute:
  # Окно оспаривания в днях от даты начисления (charged_at).
  # [СВЕРИТЬ] по актуальной оферте WB — это ключевая величина дедлайна.
  window_days: 30
  # На MVP recoverable_est = сумме штрафа (уточняемая эвристика).
  recoverable_ratio: 1.0
  # Порог «дедлайн близко» (дней) — для подсветки в дашборде.
  deadline_warning_days: 7
  # Чек-лист доказательств по категориям (параметр шаблона, раздел 7 ТЗ).
  evidence_checklist:
    oversize_logistics:
      - "Фото товара с измерительной лентой/рулеткой (длина, ширина, высота)"
      - "Фото упаковки товара с измерительной лентой"
      - "Упаковочный лист / спецификация с заявленными габаритами"
      - "Скриншот карточки товара с указанными габаритами и весом"
      - "Видео процесса замера (по возможности)"
